# Part 2 of 2: the recipe app at /cookbook/ inside an EXISTING server { }
# block, leaving everything else that server does untouched.
#
#   sudo cp deploy/nginx-cookbook-locations.conf /etc/nginx/snippets/cookbook.conf
#   then add this line inside your server { } block (e.g. after server_name):
#       include snippets/cookbook.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout:
#   /cookbook/                       → /var/www/recipes/                    the app (deploy.sh)
#   /cookbook/recipes/index.json     → /var/lib/recipes/index.json          the index (recipes-index.timer)
#   /cookbook/recipes/…              → /mnt/chipolata/recipes/processed/    recipe files and images, read-only
# Any other path prefix works too: replace /cookbook/ everywhere here and in
# nginx-cookbook-http.conf. The app only uses relative URLs.
#
# Security headers are repeated in each location on purpose: in nginx an
# add_header inside a location replaces all add_header lines from outside it.
# The CSP must match tools/dev-server.mjs (a test checks this).

location = /cookbook {
    return 301 /cookbook/;
}

# The app.
location /cookbook/ {
    alias /var/www/recipes/;                                  # ← where deploy.sh puts the app
    index index.html;
    charset utf-8;
    limit_except GET HEAD { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/ld+json text/css application/javascript text/javascript image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cookbook_cache_control always;
}

# The index, built on the Pi (exact match beats the prefix below).
location = /cookbook/recipes/index.json {
    alias /var/lib/recipes/index.json;                        # ← must match recipes-index.service
    charset utf-8;
    limit_except GET HEAD { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cookbook_cache_control always;
}

# Recipe files and images from the NAS (SMB mount).
location /cookbook/recipes/ {
    alias /mnt/chipolata/recipes/processed/;                  # ← your recipes folder (keep the trailing /)
    charset utf-8;
    autoindex off;
    limit_except GET HEAD { deny all; }

    # Network filesystem: sendfile and cached file handles can serve stale
    # or truncated data.
    sendfile off;
    open_file_cache off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/ld+json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cookbook_cache_control always;

    # Hidden files are never served (checked before the rule below).
    location ~ /\. {
        return 404;
    }

    location ~* \.jsonld$ {
        types { }
        default_type application/ld+json;
        limit_except GET HEAD { deny all; }
    }
}
