# Part 1 of 2 for serving the recipe app under /cookbook/ inside an EXISTING
# nginx site (see nginx-cookbook-locations.conf). Goes in nginx's http
# context, which Debian/Raspberry Pi OS load from /etc/nginx/conf.d/:
#   sudo cp deploy/nginx-cookbook-http.conf /etc/nginx/conf.d/cookbook.conf
#
# Cache policy: app files, recipe JSON and the index have no fingerprints in
# their names, so browsers revalidate them on every load (cheap 304s) and see
# edits at once. Photos change rarely and are cached for a day.
map $uri $cookbook_cache_control {
    default                                             "no-cache";
    "~*^/cookbook/.*\.(jpe?g|png|webp|avif|gif|svg)$"   "public, max-age=86400";
}
